<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story Harbor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-nav" aria-label="Dieu huong chinh">
        <a class="brand" href="#home" data-route="home">
          <span class="brand-mark">SH</span>
          <span>
            <strong>Story Harbor</strong>
            <small>Thu vien truyen</small>
          </span>
        </a>
        <nav class="nav-list">
          <button class="nav-link active" data-route="home" title="Trang chu">
            <span class="ico home"></span><span>Trang chu</span>
          </button>
          <button class="nav-link" data-route="library" title="Thu vien">
            <span class="ico library"></span><span>Thu vien</span>
          </button>
          <button class="nav-link" data-route="shelf" title="Tu sach">
            <span class="ico shelf"></span><span>Tu sach</span>
          </button>
          <button class="nav-link" data-route="history" title="Lich su">
            <span class="ico clock"></span><span>Lich su</span>
          </button>
          <button class="nav-link" data-route="community" title="Cong dong">
            <span class="ico forum"></span><span>Cong dong</span>
          </button>
          <button class="nav-link" data-route="account" title="Tai khoan">
            <span class="ico user"></span><span>Tai khoan</span>
          </button>
          <button class="nav-link" data-route="admin" title="Quan tri">
            <span class="ico admin"></span><span>Quan tri</span>
          </button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="menu-toggle" id="menuToggle" aria-label="Mo dieu huong">
            <span></span><span></span><span></span>
          </button>
          <div class="search-box">
            <span class="search-icon"></span>
            <input id="globalSearch" type="search" placeholder="Tim truyen, tac gia, nhom dich..." autocomplete="off" />
            <div class="suggestions" id="suggestions" hidden></div>
          </div>
          <button class="icon-btn" id="notificationButton" title="Thong bao" aria-label="Thong bao">
            <span class="ico bell"></span>
            <span class="badge" id="notificationBadge">3</span>
          </button>
          <button class="profile-chip" data-route="account">
            <span class="avatar">LA</span>
            <span>Linh An</span>
          </button>
        </header>

        <section id="view" class="view" aria-live="polite"></section>
      </main>
    </div>

    <div class="toast-stack" id="toastStack" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
