<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Manager - Đơn Giản</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    /* ===== FORM THÊM TRUYỆN ===== */
    .add-manga-section {
      background: white;
      padding: 25px;
      border-radius: 10px;
      margin-bottom: 30px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .add-manga-section h2 {
      margin-bottom: 20px;
      color: #333;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }

    input[type="text"],
    input[type="file"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .cover-preview {
      max-width: 150px;
      max-height: 200px;
      border-radius: 5px;
      margin-top: 10px;
      border: 1px solid #ddd;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: #667eea;
      color: white;
      width: 100%;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-danger {
      background: #e74c3c;
      color: white;
    }

    .btn-danger:hover {
      background: #c0392b;
    }

    .btn-success {
      background: #27ae60;
      color: white;
    }

    .btn-success:hover {
      background: #229954;
    }

    .btn-warning {
      background: #f39c12;
      color: white;
    }

    .btn-warning:hover {
      background: #d68910;
    }

    .btn-secondary {
      background: #95a5a6;
      color: white;
    }

    .btn-secondary:hover {
      background: #7f8c8d;
    }

    /* ===== DANH SÁCH TRUYỆN ===== */
    .manga-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .manga-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    .manga-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .manga-cover {
      width: 100%;
      height: 280px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3em;
      overflow: hidden;
    }

    .manga-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .manga-info {
      padding: 15px;
    }

    .manga-title {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 8px;
      color: #333;
    }

    .manga-meta {
      font-size: 0.9em;
      color: #666;
      margin-bottom: 3px;
    }

    .manga-chapters-count {
      color: #667eea;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .manga-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .manga-actions button {
      padding: 8px;
      font-size: 12px;
    }

    /* ===== MODAL THÊM CHƯƠNG ===== */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      border-bottom: 2px solid #667eea;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      color: #333;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    /* ===== CHAPTER LIST ===== */
    .chapters-section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    .chapters-section.active {
      display: block;
    }

    .chapter-item {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 10px;
      border-left: 4px solid #667eea;
    }

    .chapter-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .chapter-images {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .chapter-image-thumb {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #ddd;
    }

    .chapter-actions {
      display: flex;
      gap: 10px;
    }

    .chapter-actions button {
      padding: 5px 10px;
      font-size: 12px;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      background: white;
      padding: 60px 20px;
      border-radius: 10px;
      text-align: center;
      color: #999;
    }

    .empty-state h3 {
      font-size: 1.5em;
      margin-bottom: 10px;
    }

    /* ===== LOADING ===== */
    .loading {
      display: none;
      text-align: center;
      margin: 20px 0;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(102, 126, 234, 0.3);
      border-radius: 50%;
      border-top-color: #667eea;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      header h1 {
        font-size: 2em;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .manga-list {
        grid-template-columns: 1fr;
      }

      .manga-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <header>
      <h1>📚 Manga Manager</h1>
      <p>Quản lý truyện tranh yêu thích của bạn</p>
    </header>

    <!-- FORM THÊM TRUYỆN -->
    <div class="add-manga-section">
      <h2>➕ Thêm Truyện Mới</h2>
      <form id="mangaForm">
        <div class="form-row">
          <div class="form-group">
            <label for="mangaName">Tên Truyện *</label>
            <input type="text" id="mangaName" placeholder="VD: One Piece" required>
          </div>
          <div class="form-group">
            <label for="mangaAuthor">Tác Giả</label>
            <input type="text" id="mangaAuthor" placeholder="VD: Oda">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="mangaStatus">Tình Trạng</label>
            <select id="mangaStatus">
              <option>Đang Ra</option>
              <option>Hoàn Thành</option>
              <option>Tạm Ngưng</option>
            </select>
          </div>
          <div class="form-group">
            <label for="mangaType">Loại</label>
            <select id="mangaType">
              <option>Manga</option>
              <option>Manhwa</option>
              <option>Manhua</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="mangaCover">Ảnh Bìa (Click để chọn từ máy tính)</label>
          <input type="file" id="mangaCover" accept="image/*">
          <img id="coverPreview" class="cover-preview" style="display:none;">
        </div>

        <button type="submit" class="btn btn-primary">➕ Thêm Truyện</button>
      </form>
    </div>

    <!-- DANH SÁCH TRUYỆN -->
    <div id="mangaList" class="manga-list"></div>

    <!-- EMPTY STATE -->
    <div id="emptyState" class="empty-state" style="display:none;">
      <h3>📭 Chưa có truyện nào</h3>
      <p>Hãy thêm truyện đầu tiên của bạn để bắt đầu!</p>
    </div>

    <!-- LOADING -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Đang tải ảnh lên Cloudinary...</p>
    </div>
  </div>

  <!-- MODAL THÊM CHƯƠNG -->
  <div id="chapterModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>➕ Thêm Chương Mới</h2>
        <p id="mangaNameInModal" style="color: #666; margin-top: 5px;"></p>
      </div>
      <form id="chapterForm">
        <div class="form-group">
          <label for="chapterName">Tên Chương *</label>
          <input type="text" id="chapterName" placeholder="VD: Chương 1 - Hành Trình Bắt Đầu" required>
        </div>

        <div class="form-group">
          <label for="chapterImages">Chọn Ảnh Trang Truyện (Click hoặc Kéo & Thả)</label>
          <input type="file" id="chapterImages" accept="image/*" multiple required>
          <small style="color: #999; display: block; margin-top: 5px;">💡 Bạn có thể chọn nhiều ảnh một lúc</small>
        </div>

        <div id="imagePreview" style="margin: 15px 0;"></div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeChapterModal()">Hủy</button>
          <button type="submit" class="btn btn-success">💾 Lưu Chương</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL XEM CHAPTER -->
  <div id="viewChapterModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="viewChapterTitle">Xem Chương</h2>
      </div>
      <div id="viewChapterContent" style="max-height: 500px; overflow-y: auto;"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeViewChapterModal()">Đóng</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
